# Sử dụng backend glx để giao tiếp trực tiếp với OpenGL
backend = "glx";

# Kích hoạt đồng bộ dọc (VSync) để chống xé hình
vsync = true;

# Các tùy chọn tối ưu hiệu năng và tránh rác hình ảnh
glx-copy-from-front = false;
use-damage = true;

#
# shadow = false;
#
# corner-radius = 10;
#
# detect-rounded-corners = true;
#
detect-client-opacity = true;

no-fading-openclose = true;

# inactive-opacity = 0.9;
